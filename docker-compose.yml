version: '3.8'

services:
  # 1. PostgreSQL Relational Database (Orders, Users, Restaurants, Menus, Audit Logs)
  postgres:
    image: postgres:16-alpine
    container_name: deliverapp_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deliverapp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-epicurean_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-deliverapp_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deliverapp_user -d deliverapp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Real-Time Hot Location Store
  redis:
    image: redis:7-alpine
    container_name: deliverapp_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Core Backend API & Real-Time Gateway
  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    container_name: deliverapp_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://deliverapp_user:epicurean_secret_2026@postgres:5432/deliverapp_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-epicurean_jwt_secret_key_prod_2026}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_epicurean}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-rzp_secret_epicurean}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Restaurant Dashboard (Next.js)
  restaurant-dashboard:
    build:
      context: .
      dockerfile: apps/restaurant-dashboard/Dockerfile
    container_name: deliverapp_dashboard
    restart: always
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://backend:5000
      NEXT_PUBLIC_RESTAURANT_ID: rest_forno_doro
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
