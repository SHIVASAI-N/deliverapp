  </head><body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col"><main class="flex-1 flex flex-col relative w-full bg-surface pt-safe pb-safe"><div class="flex flex-col w-full pb-8 select-none">
<!-- Minimalist Upscale Top App Bar -->
<header class="flex items-center justify-between px-5 pt-3 pb-2 w-full">
<button aria-label="Go back" class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface active:scale-95 transition-transform duration-150" type="button">
<span class="material-symbols-outlined text-[20px]">arrow_back_ios_new</span>
</button>
<div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-surface-container-low">
<span class="material-symbols-outlined text-primary text-[18px]" style="font-variation-settings: 'FILL' 1;">restaurant_menu</span>
<span class="font-headline-sm text-body-sm text-on-surface font-semibold tracking-wider uppercase text-[11px]">FreshFleet</span>
</div>
<button aria-label="Customer Care" class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-secondary active:scale-95 transition-transform duration-150" type="button">
<span class="material-symbols-outlined text-[20px]">support_agent</span>
</button>
</header>
<!-- Editorial Epicurean Hero Imagery Strip -->
<div class="px-5 pt-3 pb-2">
<div class="w-full h-32 rounded-2xl overflow-hidden relative shadow-sm">

<div class="absolute inset-0 bg-gradient-to-t from-inverse-surface/80 via-inverse-surface/20 to-transparent flex items-end p-3.5">
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-primary-fixed-dim animate-pulse"></span>
<p class="font-body-sm text-surface-container-lowest text-label-sm tracking-wide">Table &amp; Private Chef Courier Access</p>
</div>
</div>
</div>
</div>
<!-- Content & Verification Form Section -->
<section class="flex flex-col px-5 pt-4">
<!-- Headline & Subtext -->
<div class="space-y-1.5 mb-6">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface font-semibold tracking-tight">
        Verify phone number
      </h1>
<p class="font-body-md text-body-md text-secondary leading-relaxed">
        We sent an epicurean access passcode to 
        <span class="font-headline-sm text-on-surface font-semibold whitespace-nowrap">+91 98452 31890</span>
<button class="inline-flex items-center ml-1.5 font-label-md text-primary hover:opacity-80 transition-opacity font-semibold underline underline-offset-2" type="button">
          Edit
        </button>
</p>
</div>
<!-- 6-Digit OTP Cells -->
<div class="flex items-center justify-between gap-2 sm:gap-2.5 my-2">
<!-- Box 1: Filled -->
<div class="flex-1 h-14 rounded-2xl bg-surface-container-lowest shadow-sm flex items-center justify-center transition-all">
<span class="font-headline-md text-headline-md text-on-surface font-semibold">4</span>
</div>
<!-- Box 2: Filled -->
<div class="flex-1 h-14 rounded-2xl bg-surface-container-lowest shadow-sm flex items-center justify-center transition-all">
<span class="font-headline-md text-headline-md text-on-surface font-semibold">8</span>
</div>
<!-- Box 3: Filled -->
<div class="flex-1 h-14 rounded-2xl bg-surface-container-lowest shadow-sm flex items-center justify-center transition-all">
<span class="font-headline-md text-headline-md text-on-surface font-semibold">2</span>
</div>
<!-- Box 4: Active Focus State with cursor -->
<div class="flex-1 h-14 rounded-2xl bg-surface-container-lowest shadow-md flex items-center justify-center relative bg-gradient-to-b from-surface-container-lowest to-surface-container-low">
<span class="w-0.5 h-6 bg-primary rounded-full animate-pulse"></span>
</div>
<!-- Box 5: Empty Placeholder -->
<div class="flex-1 h-14 rounded-2xl bg-surface-container-lowest/80 shadow-sm flex items-center justify-center">
<span class="w-2 h-2 rounded-full bg-outline-variant/60"></span>
</div>

<span class="w-2 h-2 rounded-full bg-outline-variant/60"></span>
</div>
</div>

<span class="material-symbols-outlined text-[15px] animate-spin text-primary" style="animation-duration: 4s;">timelapse</span>
<span class="font-label-md text-label-md">Resend code in <strong class="text-on-surface">0:30</strong></span>
</div>
<div class="flex items-center justify-center gap-5 pt-1">
<button class="flex items-center gap-1 text-secondary opacity-60 cursor-not-allowed hover:opacity-80 transition-opacity" type="button">
<span class="material-symbols-outlined text-[16px]">sms</span>
<span class="font-label-md text-label-md font-semibold">Resend via SMS</span>
</button>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<button class="flex items-center gap-1 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">chat</span>
<span class="font-label-md text-label-md font-semibold">Receive via WhatsApp</span>
</button>
</div>
</div>
<!-- Primary CTA Button -->
<button class="w-full h-14 mt-3 rounded-full bg-primary text-on-primary font-label-lg text-label-lg font-semibold flex items-center justify-center gap-2 shadow-lg hover:bg-primary-container active:scale-[0.99] transition-all" style="box-shadow: 0 8px 24px -4px rgba(175, 41, 0, 0.28);" type="button">
<span>Verify &amp; Continue</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>

<div class="grid grid-cols-3 gap-y-2.5 gap-x-4 max-w-sm mx-auto pb-2">

</button>
<!-- 2 -->

<span class="font-headline-sm text-headline-sm text-on-surface font-semibold leading-none">2</span>
<span class="font-label-sm text-[10px] text-secondary tracking-widest uppercase mt-0.5">ABC</span>
</button>
<!-- 3 -->
<button class="h-13 py-2.5 rounded-2xl bg-surface-container-lowest flex flex-col items-center justify-center shadow-sm active:bg-secondary-container transition-colors" type="button">
<span class="font-headline-sm text-headline-sm text-on-surface font-semibold leading-none">3</span>
<span class="font-label-sm text-[10px] text-secondary tracking-widest uppercase mt-0.5">DEF</span>
</button>
<!-- 4 -->
<button class="h-13 py-2.5 rounded-2xl bg-surface-container-lowest flex flex-col items-center justify-center shadow-sm active:bg-secondary-container transition-colors" type="button">
<span class="font-headline-sm text-headline-sm text-on-surface font-semibold leading-none">4</span>
<span class="font-label-sm text-[10px] text-secondary tracking-widest uppercase mt-0.5">GHI</span>
</button>
<!-- 5 -->
<button class="h-13 py-2.5 rounded-2xl bg-surface-container-lowest flex flex-col items-center justify-center shadow-sm active:bg-secondary-container transition-colors" type="button">
<span class="font-headline-sm text-headline-sm text-on-surface font-semibold leading-none">5</span>
<span class="font-label-sm text-[10px] text-secondary tracking-widest uppercase mt-0.5">JKL</span>
</button>
<!-- 6 -->
<button class="h-13 py-2.5 rounded-2xl bg-surface-container-lowest flex flex-col items-center justify-center shadow-sm active:bg-secondary-container transition-colors" type="button">
<span class="font-headline-sm text-headline-sm text-on-surface font-semibold leading-none">6</span>
<span class="font-label-sm text-[10px] text-secondary tracking-widest uppercase mt-0.5">MNO</span>
</button>
<!-- 7 -->
<button class="h-13 py-2.5 rounded-2xl bg-surface-container-lowest flex flex-col items-center justify-center shadow-sm active:bg-secondary-container transition-colors" type="button">
<span class="font-headline-sm text-headline-sm text-on-surface font-semibold leading-none">7</span>
<span class="font-label-sm text-[10px] text-secondary tracking-widest uppercase mt-0.5">PQRS</span>
</button>
<!-- 8 -->
<button class="h-13 py-2.5 rounded-2xl bg-surface-container-lowest flex flex-col items-center justify-center shadow-sm active:bg-secondary-container transition-colors" type="button">
<span class="font-headline-sm text-headline-sm text-on-surface font-semibold leading-none">8</span>
<span class="font-label-sm text-[10px] text-secondary tracking-widest uppercase mt-0.5">TUV</span>
</button>
<!-- 9 -->
<button class="h-13 py-2.5 rounded-2xl bg-surface-container-lowest flex flex-col items-center justify-center shadow-sm active:bg-secondary-container transition-colors" type="button">
<span class="font-headline-sm text-headline-sm text-on-surface font-semibold leading-none">9</span>
<span class="font-label-sm text-[10px] text-secondary tracking-widest uppercase mt-0.5">WXYZ</span>
</button>
<!-- Blank / FaceID trigger -->
<button class="h-13 py-2.5 rounded-2xl flex items-center justify-center text-secondary active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[24px]">fingerprint</span>
</button>
<!-- 0 -->
<button class="h-13 py-2.5 rounded-2xl bg-surface-container-lowest flex flex-col items-center justify-center shadow-sm active:bg-secondary-container transition-colors" type="button">
<span class="font-headline-sm text-headline-sm text-on-surface font-semibold leading-none">0</span>
<span class="font-label-sm text-[10px] text-secondary tracking-widest uppercase mt-0.5 opacity-60">+</span>
</button>
<!-- Backspace -->
<button class="h-13 py-2.5 rounded-2xl flex items-center justify-center text-on-surface active:scale-90 transition-transform" type="button">
<span class="material-symbols-outlined text-[24px]">backspace</span>
</button>
</div>
</footer>
</div>
<script>
  // Subtle interactive keypad feedback
  document.querySelectorAll('footer button').forEach(button => {
    button.addEventListener('click', () => {
      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(12);
      }
    });
  });
</script></main></body></html>
