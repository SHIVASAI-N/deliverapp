name: DeliverApp CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Build, Validate Types & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Build Shared Types Package
        run: |
          cd packages/types
          npm install || true
          npm run build || true

      - name: Build Core Backend Service
        run: |
          cd services/backend
          npm install || true
          node build.js

      - name: Execute Full Backend Integration Test Suite
        env:
          PORT: 8080
        run: |
          node services/backend/test-backend.js

  docker-build:
    name: Docker Container Image Build
    runs-on: ubuntu-latest
    needs: validate-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/backend/Dockerfile
          push: false
          tags: deliverapp/backend:latest
